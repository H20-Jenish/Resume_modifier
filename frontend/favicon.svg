<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="ai-glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa"/>
            <stop offset="100%" stop-color="#2563eb"/>
        </linearGradient>
        
        <filter id="glow">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="512" height="512" rx="120" fill="#09090b" stroke="#27272a" stroke-width="12"/>

    <path fill="#18181b" stroke="#3f3f46" stroke-width="16" stroke-linejoin="round" d="M130 110 h170 l80 80 v220 h-250 z"/>
    <path fill="#27272a" stroke="#3f3f46" stroke-width="16" stroke-linejoin="round" d="M300 110 v80 h80"/>

    <line x1="170" y1="180" x2="260" y2="180" stroke="#3f3f46" stroke-width="12" stroke-linecap="round"/>
    <line x1="170" y1="220" x2="290" y2="220" stroke="#3f3f46" stroke-width="12" stroke-linecap="round"/>

    <text x="245" y="350" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="100" fill="#e4e4e7" text-anchor="middle" letter-spacing="-2">RP</text>

    <g filter="url(#glow)">
        <path fill="url(#ai-glow)" d="M430 80 l40 40 l-160 160 l-60 20 l20 -60 z"/>
        <line x1="430" y1="120" x2="350" y2="200" stroke="#09090b" stroke-width="6" stroke-linecap="round"/>
        
        <path fill="#4ade80" d="M300 290 C 300 270, 260 270, 260 250 C 260 270, 220 270, 220 290 C 260 290, 260 310, 260 330 C 260 310, 300 310, 300 290 Z"/>
    </g>
</svg>
